openapi: 3.0.0
info:
  title: AI B2C API
  description: API для работы с B2C ИИ-чатами. Включает админские методы для управления контекстами/этапами (stages) и клиентские (B2C) методы для общения с ИИ.
  version: 1.0.0
servers:
  - url: /
    description: Base URL
paths:
  # ==================== ADMIN ROUTES ====================
  /admin/ai-b2c/brain-contexts:
    get:
      summary: Получить список Brain Contexts
      description: Возвращает список базовых контекстов мозга (промптов) для проектов. Доступно для admin, super_admin.
      tags:
        - Admin AI B2C
    post:
      summary: Создать новый Brain Context
      description: Создает новый контекст для ИИ. Требует admin или super_admin.
      tags:
        - Admin AI B2C
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role_prompt: { type: string }
  /admin/ai-b2c/brain-contexts/{id}:
    put:
      summary: Обновить Brain Context
      description: Обновление существующего контекста по ID.
      tags:
        - Admin AI B2C
    delete:
      summary: Удалить Brain Context
      description: Удаление контекста по ID.
      tags:
        - Admin AI B2C

  /admin/ai-b2c/stages:
    get:
      summary: Получить список Stages (Сценариев/Этапов)
      description: Стейджи (например, PFP1, PFP2) представляют собой разные этапы или сценарии общения.
      tags:
        - Admin AI B2C
    post:
      summary: Создать Stage
      tags:
        - Admin AI B2C
  /admin/ai-b2c/stages/{id}:
    put:
      summary: Обновить Stage
      tags:
        - Admin AI B2C

  /admin/ai-b2c/settings:
    get:
      summary: Получить настройки внешнего вида ассистента (имя, аватар, описание)
      description: Возвращает настройки AI B2C ассистента для текущего проекта (по projectId / токену).
      tags:
        - Admin AI B2C
      parameters:
        - $ref: '#/components/parameters/flowKeyQuery'
      responses:
        '200':
          description: Текущие настройки или null, если ещё не заданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiB2cSettings'
    put:
      summary: Обновить/Создать настройки внешнего вида ассистента
      description: Устанавливает имя, аватар и зелёное описание ассистента для проекта.
      tags:
        - Admin AI B2C
      parameters:
        - $ref: '#/components/parameters/flowKeyQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiB2cSettingsUpdate'
      responses:
        '200':
          description: Обновлённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiB2cSettings'
        '201':
          description: Настройки созданы впервые
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiB2cSettings'
    delete:
      summary: Удалить Stage
      tags:
        - Admin AI B2C

  /pfp/ai-b2c/flows:
    get:
      summary: Список B2C-оркестраторов (flows) проекта
      description: |
        Несколько независимых сценариев site-flow на один проект.
        `flow_key=default` — обратная совместимость; для `/plan` обычно `plan`.
      tags:
        - Agent AI B2C
      responses:
        '200':
          description: Список flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiB2cFlow'
    post:
      summary: Создать новый flow (оркестратор)
      tags:
        - Agent AI B2C
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiB2cFlowCreate'
      responses:
        '201':
          description: Flow создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiB2cFlow'

  # ==================== CLIENT (B2C) ROUTES ====================
  /my/ai-b2c/chat:
    post:
      summary: Отправить сообщение ИИ (Обычный ответ)
      description: Метод для отправки сообщения пользователя ассистенту без стриминга. Возвращает готовый ответ.
      tags:
        - Client AI B2C
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: "Текст сообщения пользователя" }
                stage: { type: string, description: "Стейдж чата (например, PFP1)" }
  
  /my/ai-b2c/chat/stream:
    post:
      summary: Отправить сообщение ИИ (Стриминг SSE)
      description: Метод для отправки сообщения и получения ответа по частям через Server-Sent Events (SSE). Идеально для UX печатной машинки.
      tags:
        - Client AI B2C
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                stage: { type: string }

  /my/ai-b2c/chat/dynamic/stream:
    post:
      summary: B2C-оркестратор (Стриминг SSE, 2 шага)
      description: |
        Поток для `/plan` и site dynamic-flow:
        1) **Оркестратор** (1-й LLM) выбирает команду из whitelist `stage_key` flow + правил `command_context_text` / `dynamic_context_text`.
        2) **Генератор** (2-й LLM) отвечает по `content` выбранной стадии + данные клиента.

        **SSE (формат PFP):**
        - `classifier_command` — `{ type, command, stage_key, classifierSkipped }` — фронт переключает экран
        - `text` — `{ type, text }` — чанки ответа в чат
        - `done` — `{ type: "done" }`

        Вход: текст чата **или** UI-событие (`event`, выбор цели, данные страницы).
        Не путать с `chat_AI/stream` и `constructor/site-chat`.
      tags:
        - Client AI B2C
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiB2cOrchestratorTurn'
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Строки `data: {json}\n\n`. См. components/schemas/AiB2cSse*.

  /my/ai-b2c/chat_AI/stream:
    post:
      summary: chat_AI flow (Стриминг SSE, 2 шага)
      description: |
        Отдельный endpoint для chat_AI с независимыми наборами контекстов и истории.
        Не влияет на site-flow `/my/ai-b2c/chat/stream`.
      tags:
        - Client AI B2C
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: "Текст сообщения пользователя" }
  
  /my/ai-b2c/history:
    get:
      summary: Получить историю чата
      description: Возвращает историю сообщений пользователя в рамках flow и опционально stage.
      tags:
        - Client AI B2C
      parameters:
        - $ref: '#/components/parameters/flowKeyQuery'
        - in: query
          name: stage
          schema:
            type: string
          description: Фильтр по stage_key (опционально).
    delete:
      summary: Очистить историю чата
      description: Удаляет историю сообщений между клиентом и ИИ в рамках flow.
      tags:
        - Client AI B2C
      parameters:
        - $ref: '#/components/parameters/flowKeyQuery'
        - in: query
          name: stage
          schema:
            type: string

  /my/ai-b2c/stages:
    get:
      summary: Получить доступные Stages (Этапы) для клиента
      description: Активные стадии текущего проекта в рамках выбранного flow.
      tags:
        - Client AI B2C
      parameters:
        - $ref: '#/components/parameters/flowKeyQuery'

  /my/ai-b2c/settings:
    get:
      summary: Получить настройки ассистента для клиента
      description: Возвращает имя, аватар и зелёное описание ассистента в рамках проекта клиента.
      tags:
        - Client AI B2C
      responses:
        '200':
          description: Настройки ассистента (могут быть null, если не настроены)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiB2cSettingsPublic'

components:
  parameters:
    flowKeyQuery:
      in: query
      name: flow_key
      schema:
        type: string
        default: default
      description: Ключ B2C-оркестратора (flow). Для `/plan` — обычно `plan`.

  schemas:
    AiB2cFlow:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        flow_key:
          type: string
          description: Уникальный slug в рамках проекта (`default`, `plan`, …).
        title: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiB2cFlowCreate:
      type: object
      required: [ flow_key, title ]
      properties:
        flow_key:
          type: string
          description: Новый ключ (не `default`). Латиница, цифры, `_`, `-`.
        title: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
        clone_from:
          type: string
          default: default
          description: Скопировать brain/stages/settings из этого flow.

    AiB2cOrchestratorTurn:
      type: object
      properties:
        flow_key:
          type: string
          default: default
          description: Оркестратор для `/plan` — `plan`.
        message:
          type: string
          description: Текст из чата.
        event:
          type: string
          description: UI-событие (`goal_selected`, `page_submit`, …).
        page:
          type: string
          description: Текущий route (`/vybor_celi2`).
        page_data:
          type: object
          additionalProperties: true
          description: Данные формы/страницы.
        goal_type_id:
          type: integer
          description: ID типа цели при выборе на витрине.
        goal_name:
          type: string
      anyOf:
        - required: [ message ]
        - required: [ event ]

    AiB2cSseClassifierCommand:
      type: object
      required: [ type, classifierSkipped ]
      properties:
        type:
          type: string
          enum: [ classifier_command ]
        command:
          type: string
          nullable: true
          description: Команда для навигации (`/test23_pensia`).
        stage_key:
          type: string
          nullable: true
          description: Канонический ключ стадии из БД (может совпадать с command).
        classifierSkipped:
          type: boolean
          description: true на первом сообщении в истории flow (старт без роутера).

    AiB2cSseText:
      type: object
      required: [ type, text ]
      properties:
        type:
          type: string
          enum: [ text ]
        text:
          type: string
          description: Чанк ответа ассистента.

    AiB2cSseDone:
      type: object
      required: [ type ]
      properties:
        type:
          type: string
          enum: [ done ]

    AiB2cSettings:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        flow_key:
          type: string
          default: default
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        tagline: { type: string, nullable: true }
        dynamic_context_text: { type: string, nullable: true }
        openrouter_model: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiB2cSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string }
        tagline: { type: string, nullable: true }
        dynamic_context_text: { type: string, nullable: true }
        openrouter_model: { type: string, nullable: true }

    AiB2cSettingsPublic:
      type: object
      nullable: true
      properties:
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        tagline: { type: string, nullable: true }

    # --- Схемы для ЛК агента (см. docs/api/agent_lk.yaml) ---
    AiB2cBrainContextCreate:
      type: object
      required: [ title, content ]
      properties:
        flow_key:
          type: string
          default: default
          description: Flow, к которому относится контекст (query `flow_key` при GET).
        title:
          type: string
        content:
          type: string
          description: Текст brain-контекста (промпт / знания ассистента).
        is_active:
          type: boolean
          default: true
        priority:
          type: integer
          default: 0
          description: Чем больше, тем выше приоритет при склейке контекстов.

    AiB2cBrainContextUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        content: { type: string }
        is_active: { type: boolean }
        priority: { type: integer }

    AiB2cStageCreate:
      type: object
      required: [ stage_key, title, content ]
      properties:
        flow_key:
          type: string
          default: default
          description: Flow оркестратора (query `flow_key` при GET списка).
        stage_key:
          type: string
          description: |
            Ключ стадии = команда страницы (`/test23_pensia`, `/vybor_celi2`). Допустимы варианты со слэшем и без.
        title:
          type: string
          description: Человекочитаемое название для админки/ЛК.
        content:
          type: string
          description: Промпт **второго ИИ** — как отвечать пользователю на этой стадии.
        command_context_text:
          type: string
          nullable: true
          description: |
            Промпт **первого ИИ** (роутер): на этой стадии какие команды `/…` выдавать. Если не задан или null,
            используется глобальный `dynamic_context_text` из `GET/PUT /pfp/ai-b2c/settings`.
        is_active:
          type: boolean
          default: true
        priority:
          type: integer
          default: 0

    AiB2cStageUpdate:
      type: object
      minProperties: 1
      properties:
        stage_key: { type: string }
        title: { type: string }
        content:
          type: string
          description: Промпт второго ИИ.
        command_context_text:
          type: string
          nullable: true
          description: Промпт первого ИИ; можно передать `null`, чтобы сбросить и снова использовать глобальный `dynamic_context_text`.
        is_active: { type: boolean }
        priority: { type: integer }
