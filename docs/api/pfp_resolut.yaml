openapi: 3.0.0
info:
  title: PFP Resolut API
  description: |
    Отдельная спека по интеграции AV Inform / Resolut для ЛК агента.
    Префикс путей: `/api/pfp/resolut`.

    **Рекомендуемый порядок (ЛК агента, из последнего расчёта клиента):**
    1. У клиента сохранён `goals_summary` после пересчёта.
    2. `POST /pfp/resolut/plan-quotes` — бэкенд собирает `quotes[]` из `summary.consolidated_portfolio` (и fallback по целям); опционально `include_monthly_flow`, `quote_patches` для недостающих полей.
    3. `POST /pfp/resolut/plan-publish-preview` — то же + `eligible`/`skipped` как у ручного preview.
    4. `POST /pfp/resolut/publish-from-plan` — сборка + публикация + история; тело как у `plan-quotes` + опционально `resolut_client`.
    5. `GET /pfp/resolut/link` сразу после успеха.

    **Альтернатива (ручная сборка quotes на фронте):** `products` → `suggest-quote-line` / `quote` → `publish-preview` → `publish`.

    Ошибки публикации смотри в теле ответа (`skipped`, `error.details`). Сырой прокси: `POST /pfp/resolut/portfolio`.
  version: 1.0.0
servers:
  - url: /api
    description: Main API server
security:
  - bearerAuth: []

paths:
  /pfp/resolut/products:
    post:
      tags: [ "Resolut Proxies" ]
      summary: Получить список Resolut-продуктов агента
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Нормализованный ответ прокси
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutNormalizedResponse'

  /pfp/resolut/quote:
    post:
      tags: [ "Resolut Proxies" ]
      summary: Котировка Resolut-продукта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ code, parameters ]
              properties:
                code:
                  type: string
                  description: pfpCode из Resolut products (например assetShort, capital, depAlfa, pdsAlfa)
                  example: assetShort
                parameters:
                  type: object
                  additionalProperties: true
              examples:
                nszh:
                  summary: НСЖ (накоп)
                  value:
                    code: assetShort
                    parameters:
                      currency: RUR
                      pType: 0
                      term: 10
                      insuredPerson: { dob: "15.05.1990", sex: male }
                      calcData: { valuationType: byLimit, limit: 2000000 }
                iszh:
                  summary: ИСЖ (Капитал под управлением)
                  value:
                    code: capital
                    parameters:
                      calcData: { premium: 1500000 }
                      insuredPerson: { dob: "15.05.1990", sex: male }
                deposit:
                  summary: Депозит / ПДС
                  value:
                    code: depAlfa
                    parameters:
                      clientType: { code: common, name: "Общий" }
                      calcData: { limit: 2000000, capitalise: false, term: 12 }
      responses:
        '200':
          description: Нормализованный ответ прокси
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutNormalizedResponse'

  /pfp/resolut/client:
    post:
      tags: [ "Resolut Proxies" ]
      summary: Создание/обновление клиента в Resolut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutClientPayload'
      responses:
        '200':
          description: Нормализованный ответ прокси
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutNormalizedResponse'
    get:
      tags: [ "Resolut Proxies" ]
      summary: Получение клиента в Resolut по code
      parameters:
        - name: code
          in: query
          required: true
          schema:
            oneOf:
              - type: string
              - type: integer
      responses:
        '200':
          description: Нормализованный ответ прокси
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutNormalizedResponse'

  /pfp/resolut/portfolio:
    post:
      tags: [ "Resolut Proxies" ]
      summary: Публикация портфеля в Resolut (прямой прокси)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ quotes, client ]
              properties:
                quotes:
                  type: array
                  items:
                    type: object
                    required: [ code, parameters ]
                    properties:
                      code: { type: string }
                      parameters:
                        type: object
                        additionalProperties: true
                client:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Нормализованный ответ прокси
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutNormalizedResponse'

  /pfp/resolut/link:
    get:
      tags: [ "Resolut Proxies" ]
      summary: Одноразовая ссылка в Resolut
      description: TTL у партнёра около 20 секунд.
      responses:
        '200':
          description: Нормализованный ответ прокси
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutNormalizedResponse'

  /pfp/resolut/publish-preview:
    post:
      tags: [ "Resolut Publish" ]
      summary: Предпросмотр публикации (фильтр eligible/skipped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPreviewRequest'
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishPreviewResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'

  /pfp/resolut/suggest-quote-line:
    post:
      tags: [ "Resolut Publish" ]
      summary: Черновик строки quote/portfolio (НСЖ или ИСЖ)
      description: |
        Собирает `code` (из `products.resolut_pfp_code`) и `parameters`:
        - **НСЖ** (`nszh_like`): currency, pType, term, calcData byLimit/byPremium, insuredPerson;
        - **ИСЖ** (`iszh_like`, OpenAPI ver3): `calcData.premium` + `insuredPerson` (код демо: `capital`).
        - **DEPOSIT/PDS** (`deposit_like`): `clientType` + `calcData.limit/capitalise/term` (демо: `depAlfa`, `pdsAlfa`).
          Для `DEPOSIT/PDS` используйте только `valuation_type=byLimit`; `p_type` не поддерживается.
        Те же `parameters` для `quote` и `portfolio`. Только проект `RESOLUT_PROJECT_ID`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestQuoteLineRequest'
      responses:
        '200':
          description: Готовая строка для quote и для массива quotes при publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestQuoteLineResponse'
        '400':
          description: Нет resolut-кода у продукта или неверные поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'
        '404':
          description: Клиент или продукт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'

  /pfp/resolut/plan-quotes:
    post:
      tags: [ "Resolut Publish" ]
      summary: Собрать quotes из последнего расчёта клиента (goals_summary)
      description: |
        Источник: `clients.goals_summary` → `summary.consolidated_portfolio.assets_allocation` (суммы по `product_id`),
        при пустом своде — инструменты из целей. Схема параметров nszh_like (`byLimit` для lump). Потоки из
        `cash_flow_allocation` по умолчанию в `skipped` (`monthly_flow_skipped`); включите `include_monthly_flow: true`
        для отдельных строк `byPremium` / pType 12 (экспериментально).
        В первой итерации `DEPOSIT/PDS` в автосборку не включаются и уходят в `skipped` с `deposit_like_manual_only`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanQuotesRequest'
      responses:
        '200':
          description: Собранные quotes и пропуски
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanQuotesResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'

  /pfp/resolut/plan-publish-preview:
    post:
      tags: [ "Resolut Publish" ]
      summary: План-quotes + publish-preview (eligible/skipped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanQuotesRequest'
      responses:
        '200':
          description: Как publish-preview плюс quotes_built, plan_skipped, plan_meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true

  /pfp/resolut/publish-from-plan:
    post:
      tags: [ "Resolut Publish" ]
      summary: Сборка quotes из расчёта + публикация в Resolut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishFromPlanRequest'
      responses:
        '200':
          description: Как PublishResponse + plan_skipped, plan_meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'

  /pfp/resolut/publish:
    post:
      tags: [ "Resolut Publish" ]
      summary: Публикация в Resolut с записью истории
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Успешная публикация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400':
          description: Ошибка данных/валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'

  /pfp/resolut/publications:
    get:
      tags: [ "Resolut Publish" ]
      summary: История публикаций по клиенту
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: История публикаций
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicationRow'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishErrorResponse'

components:
  schemas:
    ResolutNormalizedResponse:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: integer }
        operation: { type: string, nullable: true }
        data:
          oneOf:
            - type: object
            - type: array
            - type: string
          nullable: true
        err:
          type: object
          nullable: true
          properties:
            code: { type: string, nullable: true }
            message: { type: string, nullable: true }
            upstream_status: { type: integer, nullable: true }

    ResolutClientPayload:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
        lastName: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        dob:
          type: string
          description: DD.MM.YYYY
          example: "01.01.1985"
        sex:
          type: string
          enum: [ male, female ]
        phone: { type: string }
        email: { type: string, format: email }

    PublishQuoteLine:
      type: object
      required: [ parameters ]
      properties:
        line_id:
          type: string
          description: Стабильный идентификатор строки на фронте
        product_id:
          type: integer
          description: Рекомендуется для строгой фильтрации по resolut_pfp_code
        code:
          type: string
          description: pfpCode для upstream Resolut
        parameters:
          type: object
          additionalProperties: true

    PublishPreviewRequest:
      type: object
      required: [ client_id, quotes ]
      properties:
        client_id: { type: integer }
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/PublishQuoteLine'

    SuggestQuoteLineRequest:
      type: object
      required: [ client_id, product_id, amount ]
      properties:
        client_id: { type: integer }
        product_id: { type: integer }
        term_months: { type: integer, minimum: 1, default: 120 }
        valuation_type:
          type: string
          enum: [ byLimit, byPremium ]
          default: byLimit
          description: Для DEPOSIT/PDS поддерживается только byLimit
        amount:
          type: number
          description: Для НСЖ/ИСЖ — страховая сумма (byLimit) или премия (byPremium); для DEPOSIT/PDS — сумма вклада/взноса
        p_type:
          type: integer
          enum: [ 0, 1, 2, 4, 12 ]
          description: Только для NSZH-like. Для DEPOSIT/PDS не используется
        client_type:
          oneOf:
            - type: string
              enum: [ common, private ]
            - type: object
              properties:
                code: { type: string, enum: [ common, private ] }
                name: { type: string }
          description: Только для DEPOSIT/PDS, обязательно. PFP принимает строку или объект и нормализует к upstream-форме
        capitalise:
          type: boolean
          description: Только для DEPOSIT/PDS, обязательно. Капитализация процентов

    SuggestQuoteLineResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            client_id: { type: integer }
            product_id: { type: integer }
            code: { type: string }
            parameters:
              type: object
              additionalProperties: true
            hints:
              type: object
              properties:
                schema: { type: string, example: nszh_like }
                note: { type: string }

    PlanQuotesRequest:
      type: object
      required: [ client_id ]
      properties:
        client_id: { type: integer }
        term_months:
          type: integer
          minimum: 1
          description: Иначе — максимум из целей расчёта или 120
        include_monthly_flow:
          type: boolean
          default: false
          description: Включить строки из cash_flow_allocation (byPremium, pType 12)
        quote_patches:
          type: array
          description: Доп. слияние в parameters/code по product_id после автосборки
          items:
            type: object
            required: [ product_id ]
            properties:
              product_id: { type: integer }
              code: { type: string }
              parameters:
                type: object
                additionalProperties: true

    PlanQuotesResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            client_id: { type: integer }
            term_months_used: { type: integer }
            include_monthly_flow: { type: boolean }
            quotes:
              type: array
              items:
                $ref: '#/components/schemas/EligibleLine'
            skipped:
              type: array
              items:
                $ref: '#/components/schemas/SkippedLine'
            meta:
              type: object
              additionalProperties: true

    PublishFromPlanRequest:
      allOf:
        - $ref: '#/components/schemas/PlanQuotesRequest'
        - type: object
          properties:
            resolut_client:
              allOf:
                - $ref: '#/components/schemas/ResolutClientPayload'
              nullable: true

    PublishRequest:
      type: object
      required: [ client_id, quotes ]
      properties:
        client_id: { type: integer }
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/PublishQuoteLine'
        resolut_client:
          allOf:
            - $ref: '#/components/schemas/ResolutClientPayload'
          nullable: true
          description: Опционально — поля, которые фронт дозапросил у пользователя

    SkippedLine:
      type: object
      properties:
        line_id: { type: string, nullable: true }
        product_id: { type: integer, nullable: true }
        code: { type: string, nullable: true }
        reason:
          type: string
          description: Например monthly_flow_skipped, deposit_like_manual_only, product_not_found
        product_name: { type: string, nullable: true }
        expected_code: { type: string, nullable: true }

    EligibleLine:
      type: object
      properties:
        line_id: { type: string, nullable: true }
        product_id: { type: integer, nullable: true }
        code: { type: string }
        parameters:
          type: object
          additionalProperties: true

    PublishPreviewResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            client_id: { type: integer }
            resolut_client_code: { type: string, nullable: true }
            eligible:
              type: array
              items:
                $ref: '#/components/schemas/EligibleLine'
            skipped:
              type: array
              items:
                $ref: '#/components/schemas/SkippedLine'

    PublishResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            client_id: { type: integer }
            resolut_client_code: { type: string, nullable: true }
            publication_id: { type: integer }
            skipped:
              type: array
              items:
                $ref: '#/components/schemas/SkippedLine'
            portfolio:
              type: object
              description: Нормализованный итог upstream portfolio (плоский и вложенный content учтены на бэке)
              properties:
                portfolio_code: { type: string, nullable: true }
                portfolio_number: { type: string, nullable: true }
                contracts:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                upstream_client_code: { type: string, nullable: true }
            resolut:
              $ref: '#/components/schemas/ResolutNormalizedResponse'

    PublicationRow:
      type: object
      properties:
        id: { type: integer }
        client_id: { type: integer }
        project_id: { type: integer, nullable: true }
        agent_id: { type: integer, nullable: true }
        resolut_client_code: { type: string, nullable: true }
        resolut_portfolio_code: { type: string, nullable: true }
        resolut_portfolio_number: { type: string, nullable: true }
        contracts_json:
          type: array
          items:
            type: object
            additionalProperties: true
        quotes_submitted_json:
          type: array
          items:
            type: object
            additionalProperties: true
        skipped_json:
          type: array
          items:
            $ref: '#/components/schemas/SkippedLine'
        created_at:
          type: string
          format: date-time

    PublishErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: RESOLUT_NOTHING_TO_PUBLISH }
            message: { type: string }
        details:
          type: object
          nullable: true
          additionalProperties: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

