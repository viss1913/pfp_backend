<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="file:///C:/Users/User/Desktop/backend%20PFP/docs/partners/finam/" />
  <title>Finam Presentation Images</title>
  <style>
    @page { size: A4 landscape; margin: 0; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      padding: 0;
    }

    .deck {
      display: grid;
      gap: 0;
      justify-content: center;
    }

    .slide {
      width: 297mm;
      height: 210mm;
      background: #fff;
      padding: 3mm;
      display: flex;
      page-break-after: always;
      overflow: hidden;
    }

    .slide:last-child {
      page-break-after: auto;
    }

    .image-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .image-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="deck">
    <section class="slide"><div class="image-frame"><img src="assets/1.png" alt="Slide 1" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/2.png" alt="Slide 2" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/3.png" alt="Slide 3" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/4.png" alt="Slide 4" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/5.png" alt="Slide 5" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/6.png" alt="Slide 6" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/7.png" alt="Slide 7" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/8.png" alt="Slide 8" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/9.png" alt="Slide 9" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/10.png" alt="Slide 10" /></div></section>
    <section class="slide"><div class="image-frame"><img src="assets/11.png" alt="Slide 11" /></div></section>
  </main>
</body>
</html>
