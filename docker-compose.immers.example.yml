# Эталон для Immers VPS — скопировать в docker-compose.yml на сервере, пароли из .env.production.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: <secret>
      MYSQL_DATABASE: pfp
      MYSQL_USER: pfp
      MYSQL_PASSWORD: <secret>
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      # Docker DNS иногда не резолвит api.resend.com (NDA 502); IPv6 AAAA без маршрута — prefer IPv4
      NODE_OPTIONS: --dns-result-order=ipv4first
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_opt:
      - ndots:0
    # Жёсткий IPv4, если резолвер отдаёт только AAAA / fetch «could not be resolved»
    extra_hosts:
      - "api.resend.com:104.20.29.242"

volumes:
  mysql_data:
