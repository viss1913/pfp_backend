openapi: 3.0.0
info:
  title: PDF Report API
  version: 1.0.0
  description: |
    Specification for the dedicated PDF Report endpoint.
    This endpoint aggregates all client data, calculations, and AI analysis into a structure optimized for visualization.

paths:
  /pfp/reports/{clientId}:
    get:
      summary: Get Full Client Report Data
      description: |
        Returns a complete dataset for generating the client's financial plan PDF.
        Includes current assets, calculated goals, and specific metrics for charts (Waterfall, Portfolio).
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful report data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'

  /pfp/reports/{clientId}/pdf:
    get:
      summary: Сгенерировать PDF отчёта клиента
      description: |
        Собирает HTML (обложка, сводная, страницы целей по наличию в отчёте) и отдаёт **application/pdf** (Puppeteer).
        Для Finam-template проектов серверная настройка `system_settings.report_finam` выбирает версию:
        `1` или отсутствие настройки — текущий v1, `2` — Finam Report v2 (`reportSchemaVersion: finam-v2.0`).
        Переменные **`FINAM_REPORT_VERSION`** (`1`|`2`) и опционально **`FINAM_REPORT_VERSION_PROJECT_IDS`** (CSV id проектов) переопределяют БД; без CSV при заданной версии действует только проект **14**.
        Порядок страниц и фильтрация — query-параметры ниже.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: includeCover
          in: query
          required: false
          description: Обложка включена по умолчанию; передайте `0` или `false`, чтобы пропустить.
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          description: Сводная включена по умолчанию; `0` или `false` — пропустить.
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          description: |
            Подмножество страниц целей через запятую: `FIN_RESERVE`, `LIFE`, `PENSION`, `PASSIVE_INCOME`, `RENT`, `INVESTMENT`, `OTHER`.
            Без параметра — для каждого типа, если в `goals_detailed` есть цель, страница попадёт в PDF.
          schema:
            type: string
            example: FIN_RESERVE,LIFE
        - name: disposition
          in: query
          required: false
          description: |
            `attachment` — отдать файл как вложение (скачивание). Иначе по умолчанию `inline`.
          schema:
            type: string
            enum:
              - attachment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PDF-документ
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректный clientId
        '401':
          description: Нет токена
        '500':
          description: Ошибка генерации (в т.ч. не выбрано ни одной страницы)

  /pfp/reports/{clientId}/pdf-url:
    get:
      summary: Сгенерировать PDF отчёта клиента и вернуть URL
      description: |
        Генерирует PDF через тот же пайплайн, загружает файл в storage и кеширует ссылку в `clients.report_pdf_*`.
        При смене `system_settings.report_finam` backend сбрасывает этот кеш; для ручной перегенерации используйте `forceRegenerate=1`.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: includeCover
          in: query
          required: false
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          description: Подмножество страниц целей через запятую; v2 поддерживает `PASSIVE_INCOME` и `RENT`.
          schema:
            type: string
        - name: forceRegenerate
          in: query
          required: false
          description: `1` или `true` — игнорировать кеш и пересобрать PDF.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PDF уже готов
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  pdf_url:
                    type: string
                  toc:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  compressed:
                    type: boolean
                  generated_at:
                    type: string
                    format: date-time
        '202':
          description: Генерация запущена
        '400':
          description: Некорректный clientId

  /pfp/reports/{clientId}/pdf/send-email:
    post:
      summary: Отправить PDF отчёта клиенту на email (от имени агента)
      description: |
        Генерирует тот же PDF, что `GET /pdf`, однократно загружает данные отчёта (включая ИИ-резюме),
        сжимает PDF, загружает его в R2 и отправляет письмо через Resend со ссылкой на скачивание. Доступно ролям агента и администратора;
        роль `client` получает 403.

        Получатель — только **email из карточки клиента** в БД (если пусто — 400).

        Параметры `includeCover`, `includeSummary`, `goalTypes` можно передать в теле JSON или query (как у GET PDF);
        приоритет у полей тела.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: includeCover
          in: query
          required: false
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                includeCover:
                  type: boolean
                includeSummary:
                  type: boolean
                goalTypes:
                  type: string
                  example: FIN_RESERVE,LIFE
      responses:
        '200':
          description: Письмо поставлено в очередь Resend
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: string
                    nullable: true
                  client_email:
                    type: string
                    format: email
                    description: Email из карточки клиента, на который отправлено
                  filename:
                    type: string
        '400':
          description: Нет email у клиента в карточке или нет контекста агента
        '401':
          description: Нет токена
        '403':
          description: Нет доступа или роль client
        '404':
          description: Клиент или агент не найдены
        '502':
          description: Ошибка провайдера почты (Resend)
        '500':
          description: Внутренняя ошибка

  /pfp/reports/{clientId}/html:
    get:
      summary: HTML полного отчёта клиента (агентский контур)
      description: |
        Собирает полный HTML отчёта (обложка, сводная, страницы целей) без рендера PDF.
        Для Finam-template проектов версия HTML/PDF выбирается настройкой `system_settings.report_finam`:
        `1` — текущий v1, `2` — Finam Report v2.
        **`FINAM_REPORT_VERSION`** / **`FINAM_REPORT_VERSION_PROJECT_IDS`** (см. PDF) могут переопределить БД.
        Удобно для предпросмотра в ЛК агента.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: includeCover
          in: query
          required: false
          description: Обложка включена по умолчанию; передайте `0` или `false`, чтобы пропустить.
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          description: Сводная включена по умолчанию; `0` или `false` — пропустить.
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          description: Подмножество страниц целей через запятую (как у PDF; v2 поддерживает `PASSIVE_INCOME` и `RENT`).
          schema:
            type: string
        - name: inline
          in: query
          required: false
          description: |
            `1` или `true` — ответ **`text/html`** (цельный документ для вкладки браузера или `iframe src`),
            без JSON. По умолчанию — JSON с полями `html`, `pages`, `toc`.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: `html` — то же, что `inline=1` (отдать документ как `text/html`).
          schema:
            type: string
            enum:
              - html
        - name: includePages
          in: query
          required: false
          description: |
            `1` или `true` — добавить в JSON массив `pages[]`. По умолчанию JSON-ответ возвращает только цельный `html`,
            `toc`, `report_schema_version` и `generated_at`, чтобы не дублировать тяжёлый payload.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: По умолчанию JSON; при `inline=1` или `format=html` — готовый HTML-документ
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                  pages:
                    type: array
                    description: Возвращается только при `includePages=1` или `includePages=true`.
                    items:
                      type: string
                  toc:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  report_schema_version:
                    type: string
                    nullable: true
                    description: Для Finam v2 — `finam-v2.0`; для v1/default обычно `null`.
                  generated_at:
                    type: string
                    format: date-time
        '400':
          description: Некорректный clientId
        '401':
          description: Нет токена
        '403':
          description: Нет доступа к клиенту
        '404':
          description: Клиент не найден
        '500':
          description: Ошибка генерации HTML

  /my/plan/report:
    get:
      summary: JSON отчёта текущего клиента (ЛК B2C)
      description: |
        Тот же контракт, что `GET /pfp/reports/{clientId}`, но идентификатор клиента берётся из JWT (`clientId` в токене).
        Требуется роль client (или разрешённые роли кабинета `/my`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful report data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: В токене нет clientId
        '401':
          description: Нет токена

  /my/plan/report/pdf:
    get:
      summary: PDF отчёта текущего клиента (ЛК B2C)
      description: |
        Генерация PDF по данным плана; визуальный стиль из `agent_report_pdf_settings` агента, указанного в `clients.agent_id`,
        либо дефолты, если агент не привязан. Для Finam-template проектов версия выбирается настройкой
        `system_settings.report_finam`: `1` — v1, `2` — Finam Report v2; те же env **`FINAM_REPORT_VERSION`** / **`FINAM_REPORT_VERSION_PROJECT_IDS`** переопределяют БД.
      parameters:
        - name: includeCover
          in: query
          required: false
          description: Обложка включена по умолчанию; `0` или `false` — пропустить.
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          description: Сводная по умолчанию включена; `0` или `false` — пропустить.
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          description: Подмножество страниц целей через запятую (как у агентского PDF; v2 поддерживает `PASSIVE_INCOME` и `RENT`).
          schema:
            type: string
        - name: disposition
          in: query
          required: false
          description: `attachment` — скачивание файла.
          schema:
            type: string
            enum:
              - attachment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PDF-документ
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Нет clientId в токене
        '401':
          description: Нет токена
        '404':
          description: Профиль клиента не найден
        '500':
          description: Ошибка генерации PDF

  /my/plan/report/pdf-url:
    get:
      summary: URL PDF отчёта текущего клиента (ЛК B2C)
      description: |
        Генерирует PDF текущего клиента, загружает файл в storage и возвращает URL.
        Использует тот же выбор версии, что агентские PDF/HTML: `system_settings.report_finam` и env **`FINAM_REPORT_VERSION`** / **`FINAM_REPORT_VERSION_PROJECT_IDS`**.
      parameters:
        - name: includeCover
          in: query
          required: false
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          schema:
            type: string
        - name: forceRegenerate
          in: query
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PDF уже готов
        '202':
          description: Генерация запущена

  /my/plan/report/html:
    get:
      summary: HTML отчёта текущего клиента (ЛК B2C)
      description: |
        Возвращает HTML-представление отчёта для фронтового предпросмотра без рендера PDF.
        Для Finam-template проектов версия выбирается настройкой `system_settings.report_finam` (и теми же env **`FINAM_REPORT_VERSION`** / **`FINAM_REPORT_VERSION_PROJECT_IDS`**, что у PDF).
        Полезно, когда нужно быстро показать страницы в веб-интерфейсе и отдельно запускать экспорт в PDF.
      parameters:
        - name: includeCover
          in: query
          required: false
          description: Обложка включена по умолчанию; `0` или `false` — пропустить.
          schema:
            type: string
        - name: includeSummary
          in: query
          required: false
          description: Сводная по умолчанию включена; `0` или `false` — пропустить.
          schema:
            type: string
        - name: goalTypes
          in: query
          required: false
          description: Подмножество страниц целей через запятую (как у PDF-эндпоинтов; v2 поддерживает `PASSIVE_INCOME` и `RENT`).
          schema:
            type: string
        - name: inline
          in: query
          required: false
          description: `1` или `true` — ответ `text/html` (цельный документ), иначе JSON.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: `html` — то же, что `inline=1`.
          schema:
            type: string
            enum:
              - html
        - name: includePages
          in: query
          required: false
          description: |
            `1` или `true` — добавить в JSON массив `pages[]`. По умолчанию JSON-ответ возвращает только цельный `html`,
            `toc`, `report_schema_version` и `generated_at`.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: По умолчанию JSON; при `inline=1` или `format=html` — `text/html`
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                    description: Единый HTML со всеми страницами отчёта.
                  pages:
                    type: array
                    description: Массив HTML-страниц (по одной строке на страницу), только при `includePages=1`.
                    items:
                      type: string
                  toc:
                    type: array
                    description: Оглавление (если доступно для текущей темы/набора страниц).
                    items:
                      type: object
                      additionalProperties: true
                  report_schema_version:
                    type: string
                    nullable: true
                    description: Для Finam v2 — `finam-v2.0`; для v1/default обычно `null`.
                  generated_at:
                    type: string
                    format: date-time
        '400':
          description: Нет clientId в токене
        '401':
          description: Нет токена
        '404':
          description: Профиль клиента не найден
        '500':
          description: Ошибка генерации HTML

  /pfp/reports/{clientId}/pages/{pageType}/html:
    get:
      summary: HTML одной страницы отчёта клиента
      description: |
        Полный HTML одной страницы A4 для печати или отладки. Данные — из расчёта клиента (`goals_detailed` и т.д.).
        Значения `pageType` совпадают с превью в pdf-settings (`SUMMARY`, `FIN_RESERVE`, …); допускаются синонимы пути (см. реализацию `reportPagesController`).
        При `system_settings.report_finam = 2` (или эквивалент через env **`FINAM_REPORT_VERSION`**) доступны v2-типы: `cover`, `intro`, `currentState`, `goals`,
        `executiveSummary`, `portfolioSummary`, `taxPlanning`, `comonAutofollow`, `iduStrategies`,
        `finamOffers`, `inflation`, `scenarios`, `roadmap`, `detailedPlan`, `riskDeclaration`, `partnerValue`.
        Query `goalId` выбирает конкретную цель, если у клиента несколько целей одного типа; `goalTypes` фильтрует набор целей для v2-модели.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: pageType
          in: path
          required: true
          schema:
            type: string
            enum:
              - SUMMARY
              - FIN_RESERVE
              - LIFE
              - PENSION
              - PASSIVE_INCOME
              - RENT
              - INVESTMENT
              - OTHER
              - goalFinReserve
              - goalLife
              - goalPension
              - goalPassiveIncome
              - goalSaveGrow
              - goalOther
              - cover
              - intro
              - currentState
              - goals
              - executiveSummary
              - portfolioSummary
              - taxPlanning
              - comonAutofollow
              - iduStrategies
              - finamOffers
              - inflation
              - scenarios
              - roadmap
              - detailedPlan
              - riskDeclaration
              - partnerValue
        - name: goalId
          in: query
          required: false
          description: ID конкретной цели для goal-страниц v1/v2.
          schema:
            type: integer
        - name: goalTypes
          in: query
          required: false
          description: Подмножество целей для v2 page model.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HTML-документ
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Неизвестный pageType или нет данных для страницы
        '401':
          description: Нет токена
        '404':
          description: Клиент или цель не найдены

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    projectKeyAuth:
      type: apiKey
      in: header
      name: x-project-key
      description: Public Project Key for multi-tenancy context
  parameters:
    ProjectKeyHeader:
      name: x-project-key
      in: header
      required: false
      description: Public key to identify the project project context
      schema:
        type: string
        example: pk_default_pfp_2026
  schemas:
    ReportResponse:
      type: object
      properties:
        client_profile:
          type: object
          properties:
            id: { type: integer }
            full_name: { type: string, example: "Иванов Иван Иванович" }
            age: { type: integer }
            email: { type: string }
        
        current_situation:
          description: Data for the "Current Financial Health" section
          type: object
          properties:
            assets_total: { type: number, description: "Total value of current assets" }
            liabilities_total: { type: number, description: "Total debts" }
            net_worth: { type: number, description: "Assets - Liabilities" }
            assets_breakdown:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }

        overall_plan:
          description: Aggregated metrics for the entire plan (all goals combined)
          type: object
          properties:
            chart_waterfall:
              description: >
                Data for the "Investment vs Result" bar/waterfall chart.
                Shows where the money comes from.
              type: object
              properties:
                invested_by_client:
                  type: number
                  description: "Total nominal amount the client will pay (Initial + Monthly * Months)"
                state_support_nominal:
                  type: number
                  description: "Total free money from State (Tax Deductions + Cofinancing)"
                investment_income:
                  type: number
                  description: "Pure market gain (Compound interest on both Client's and State's money)"
                total_projected:
                  type: number
                  description: "Final Sum (Invested + State + Income). This is the height of the final bar."
            
            consolidated_portfolio:
              description: Summary of all recommended instruments across all goals
              type: object
              properties:
                assets_allocation:
                  type: array
                  description: "For Pie Chart (By Asset Class/Instrument)"
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      share: { type: number, description: "Percentage (0-100)" }
                      amount: { type: number }
                      yield: { type: number }

        ai_executive_summary:
          type: string
          description: "Markdown-formatted text generated by AI. Contains 3 paragraphs: Praise, Efficiency Analysis, Recommendation."
          example: |
            Отличное начало! Ваш план охватывает все ключевые цели...
            
            Обратите внимание: государство добавит к вашим вложениям 1.5 млн руб...
            
            Рекомендуем настроить автопополнение, чтобы не пропускать взносы.

        pdf_summary_layout:
          type: object
          description: >
            Единый блок для вёрстки сводного PDF на фронте: продолжение основных целей после первых двух
            на HTML-сводной, пироги «распределение капитала / пополнений» по целям, подсказки page-break.
          additionalProperties: true

        comon_showcase:
          description: >
            Витрина стратегий Comon (если включено в projects.settings.comon_showcase).
            См. docs/report-pdf-frontend-contract.md
          type: object
          additionalProperties: true

        goals_detailed:
          type: array
          description: "List of calculated goals with their specific summaries"
          items:
            type: object
            properties:
              goal_type: { type: string, example: "PENSION" }
              summary:
                type: object
