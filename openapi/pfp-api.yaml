  /client/first-run:
    post:
      summary: Integrated First Run (Create Profile + Calculate Plan)
      tags:
        - Client API
      security: []
      description: |
        Atomically creates/updates a client profile (including assets, liabilities, goals) 
        and performs the initial financial plan calculation.
        
        If a client with the same email already exists, their profile is updated, 
        and all previous assets/goals are REPLACED with the ones provided in this request.
      requestBody:
        required: true
        content:
