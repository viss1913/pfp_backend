          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        phone:
          type: string
        email:
          type: string
          format: email
        avg_monthly_income:
          type: number
        spouse_avg_monthly_income:
          type: number
          nullable: true
          description: Среднемесячный доход супруги/супруга ДО НДФЛ (₽/мес). Справочное поле, пока не участвует в расчетах
        employment_type:
          type: string
        tax_mode:
          type: string
        external_uuid:
          type: string
          description: External ID provided by frontend (optional)
        uuid:
          type: string
          description: Alias for external_uuid (write-only)
          writeOnly: true
        assets_total:
          type: number
          readOnly: true
        liabilities_total:
          type: number
          readOnly: true
        net_worth:
          type: number
          readOnly: true
        goals_summary:
          type: array
          readOnly: true
          items:
            type: object
        family_profile:
          oneOf:
            - $ref: '#/components/schemas/FamilyProfile'
            - type: array
              items:
                type: object
                additionalProperties: true
          description: Семейный профиль в формате объекта или массива объектов (справочные данные, не участвуют в расчетах)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ClientAsset:
      type: object
      required:
        - type
        - name
        - current_value
      properties:
        id:
          type: integer
          readOnly: true
        type:
          type: string
          enum: [DEPOSIT, CASH, BROKERAGE, IIS, PDS, NSJ, REAL_ESTATE, CRYPTO, OTHER]
        name:
          type: string
        current_value:
          type: number
        currency:
          type: string
          default: RUB
        yield_percent:
          type: number
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        risk_level:
          type: string
          enum: [conservative, moderate, aggressive]

    ClientLiability:
      type: object
      required:
        - type
        - name
        - remaining_amount
        - monthly_payment
      properties:
        id:
          type: integer
          readOnly: true
        type:
          type: string
          enum: [MORTGAGE, CONSUMER_LOAN, CREDIT_CARD, AUTO_LOAN, OTHER]
        name:
          type: string
        remaining_amount:
          type: number
        monthly_payment:
          type: number
        interest_rate:
          type: number
        end_date:
          type: string
          format: date

    ClientCredit:
      type: object
      required:
        - type
        - balance
        - monthlyPayment
        - rate
      description: Удобный алиас для кредита. На бэке сохраняется в liabilities.
      properties:
        type:
          type: string
          enum: [MORTGAGE, CONSUMER_LOAN, CREDIT_CARD, AUTO_LOAN, OTHER]
        name:
          type: string
          description: Опциональное название кредита
        balance:
          type: number
          description: Остаток по кредиту
        monthlyPayment:
          type: number
          description: Ежемесячный платеж
        rate:
          type: number
          description: Процентная ставка

    ClientExpense:
      type: object
      required:
        - category
        - amount
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: string
          enum: [LIVING, HOUSING, CHILDREN, LOANS, LEISURE, OTHER]
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: RUB

    ClientGoal:
       type: object
       required:
         - goal_type_id
         - name
       properties:
         id:
            type: integer
            readOnly: true
         goal_type_id:
            type: integer
         name:
            type: string
         target_amount:
            type: number
         desired_monthly_income:
            type: number
         term_months:
            type: integer
         risk_profile:
            type: string
         risk_profile_extended:
            type: string
            nullable: true
            enum:
              - CONSERVATIVE
              - MODERATELY_CONSERVATIVE
              - BALANCED
              - MODERATELY_AGGRESSIVE
