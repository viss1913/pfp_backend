          description: Ссылка на страницу стратегии на comon.ru
        name:
          type: string
        min_contribution:
          type: number
          nullable: true
        risk_profile:
          type: string
          enum: [conservative, balanced, aggressive]
        description:
          type: string
          nullable: true
        portfolio:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/AgentComonStrategyPortfolioItem'

    AgentComonStrategyPatch:
      type: object
