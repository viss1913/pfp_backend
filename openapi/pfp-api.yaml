openapi: 3.0.0
info:
  title: PFP Service API
  version: 1.0.0
  description: API for managing Products & Portfolios
servers:
  - url: /api
    description: Main API server

security:
  - bearerAuth: []
  - apiKeyAuth: []
  - projectKeyAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key for server-to-server integration (Partners)
    projectKeyAuth:
      type: apiKey
      in: header
      name: x-project-key
      description: Public Project Key for multi-tenancy context
  parameters:
    ProjectKeyHeader:
      name: x-project-key
      in: header
      required: false
      description: Public key to identify the project project context
      schema:
        type: string
        example: pk_default_pfp_2026
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        product_type:
          type: string
        currency:
          type: string
        min_term_months:
          type: integer
        max_term_months:
          type: integer
        min_amount:
          type: number
        max_amount:
          type: number
        yields:
          type: array
          items:
            $ref: '#/components/schemas/ProductYield'
        resolut_pfp_code:
          type: string
          nullable: true
          maxLength: 64
          description: Код продукта PFP в API Резолюта (см. OPENAPI_SPEC Product).
        resolut_quote_p_type:
          type: integer
          nullable: true
          enum: [0, 1, 2, 4, 12]
          description: Периодичность взноса для котировки Резолюта (см. OPENAPI_SPEC Product).
    ProductYield:
      type: object
      properties:
        term_from_months:
          type: integer
        term_to_months:
          type: integer
        amount_from:
          type: number
        amount_to:
          type: number
        yield_percent:
          type: number
    Portfolio:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        currency:
          type: string
        amount_from:
          type: number
        amount_to:
          type: number
        term_from_months:
          type: integer
        term_to_months:
          type: integer
        classes:
          type: array
          items:
            type: object # simplified
        riskProfiles:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioRiskProfile'
    PortfolioRiskProfile:
      type: object
      properties:
        profile_type:
          type: string
          description: |
            Пять уровней (как расширенный риск-профиль). Три значения CONSERVATIVE | BALANCED | AGGRESSIVE по-прежнему валидны.
          enum:
            - CONSERVATIVE
            - MODERATELY_CONSERVATIVE
            - BALANCED
            - MODERATELY_AGGRESSIVE
            - AGGRESSIVE
        potential_yield_percent:
          type: number
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioInstrument'
    PortfolioInstrument:
      type: object
      properties:
        product_id:
          type: integer
        bucket_type:
          type: string
          enum: [INITIAL_CAPITAL, TOP_UP]
        share_percent:
          type: number
        order_index:
          type: integer
    SystemSetting:
      type: object
      properties:
        key:
          type: string
          description: Unique setting key
        value:
          oneOf:
            - type: string
            - type: number
            - type: object
          description: Setting value (type depends on value_type)
        description:
          type: string
          description: Human-readable description
        category:
          type: string
          description: Category (calculation, pension, etc.)
        updated_at:
          type: string
          format: date-time
    CalculationRequest:
      type: object
      required:
        - goals
      properties:
        goals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CalculationGoal'
          description: Array of goals to calculate
        client:
          $ref: '#/components/schemas/ClientData'
          description: Client data (optional, but recommended for LIFE goals)
    CalculationGoal:
      type: object
      required:
        - goal_type_id
        - name
        - target_amount
        - term_months
        - risk_profile
      properties:
        goal_type_id:
          type: integer
          description: |
            ID класса портфеля из `portfolio_classes` (см. `GET /api/pfp/portfolios/classes`).
            Примеры: `2` — пассивный доход, `3` — инвестиции, `5` — НСЖ (LIFE), `7` — финподушка, `8` — аренда, **`11` — наследство (INHERITANCE, ИСЖ-матрица)**.
          example: 5
        name:
          type: string
          description: Goal name
          example: "Жизнь"
        target_amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            Target amount in currency.
            For PASSIVE_INCOME goals (goal_type_id: 2): desired monthly income (₽/month).
            For other goals: target amount to accumulate (₽).
          example: 3000000
        term_months:
          type: integer
          minimum: 1
          description: Term in months
          example: 60
        risk_profile:
          type: string
          enum: [CONSERVATIVE, BALANCED, AGGRESSIVE]
          description: Risk profile (3 levels, backward compatible)
          example: "BALANCED"
        risk_profile_extended:
          type: string
          nullable: true
          enum:
            - CONSERVATIVE
            - MODERATELY_CONSERVATIVE
            - BALANCED
            - MODERATELY_AGGRESSIVE
            - AGGRESSIVE
          description: |
            Optional 5-level profile (same strings as portfolio `profile_type` when portfolio uses MODERATELY_* slices).
            Backend may set this from the risk questionnaire on first run / recalculate.
        initial_capital:
          type: number
          minimum: 0
          default: 0
          description: Initial capital (optional, default 0)
          example: 0
        inflation_rate:
          type: number
          minimum: 0
          description: Annual inflation rate in % (optional, uses system default if not provided)
          example: 4.0
        avg_monthly_income:
          type: number
          minimum: 0
          description: Среднемесячный доход ДО НДФЛ (₽/мес). Требуется для расчета софинансирования ПДС, если в портфеле есть продукт типа PDS
          example: 100000
        start_date:
          type: string
          format: date
          description: Дата начала цели (YYYY-MM-DD или ISO 8601). По умолчанию текущая дата. Используется для расчета софинансирования ПДС
          example: "2024-01-01"
        monthly_replenishment:
          type: number
          minimum: 0
          description: Планируемое ежемесячное пополнение (для INVESTMENT вводим вручную, для других может не использоваться)
          example: 10000
        payment_variant:
          type: integer
          enum: [0, 1, 2, 4, 12]
          description: |
            Payment variant for NSJ (LIFE goals only):
            - 0: единовременно (one-time)
            - 1: ежегодно (annually)
            - 2: раз в полгода (semi-annually)
            - 4: ежеквартально (quarterly)
            - 12: ежемесячно (monthly)
          example: 0
        program:
          type: string
          description: NSJ product code (default: "base"). Used only for LIFE goals
          example: "base"
    ClientData:
      type: object
      description: Client personal data (optional, but recommended for LIFE goals)
      properties:
        birth_date:
          type: string
          format: date
          description: |
            Дата рождения клиента (YYYY-MM-DD или ISO 8601). Для НСЖ (LIFE) желательна для точного расчёта.
            Для цели **наследство** (`goal_type_id: 11`) вместе с `goal.start_date` используется для попадания в возрастные коридоры `age_from`/`age_to` в матрице `lines` продукта ISZH.
          example: "1980-01-01"
        sex:
          type: string
          enum: [male, female, M, F, мужской, женский]
          description: Client sex. Required for accurate NSJ calculations
          example: "male"
        fio:
          type: string
          description: Full name (ФИО)
          example: "Иванов Иван Иванович"
        name:
          type: string
          description: Name (alternative to fio)
          example: "Иванов Иван Иванович"
        phone:
          type: string
          description: Phone number (will be normalized to +79999999999 format)
          example: "+79990000000"
        email:
          type: string
          format: email
          description: Email address
          example: "test@example.com"
        insured_person:
          type: object
          description: Insured person data (if different from policy holder)
          properties:
            is_policy_holder:
              type: boolean
              description: Whether the insured person is the same as policy holder
              example: false
            birth_date:
              type: string
              format: date
              description: Insured person birth date (if different from policy holder)
              example: "1985-05-15"
            sex:
              type: string
              enum: [male, female, M, F]
              description: Insured person sex (if different from policy holder)
              example: "female"
        family_profile:
          oneOf:
            - $ref: '#/components/schemas/FamilyProfile'
            - type: array
              items:
                type: object
                additionalProperties: true
          description: Семейный профиль в формате объекта или массива объектов (справочные данные, не участвуют в расчетах)
        enable_children_tax_deduction:
          type: boolean
          description: Включает расчет стандартного налогового вычета на детей в firstRun
        tax_children:
          type: array
          description: Данные о детях для налогового планирования (если не передано, может использоваться family_profile.children)
          items:
            $ref: '#/components/schemas/TaxChild'
    FamilyProfile:
      type: object
      description: Reference family profile metadata, not used in calculations.
      properties:
        marital_status:
          type: string
          enum: [single, married, divorced, widowed, civil_union]
        children:
          type: array
          items:
            $ref: '#/components/schemas/FamilyChild'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/FamilyContact'
        spouse:
          $ref: '#/components/schemas/FamilySpouse'
        family_obligations:
          type: array
          items:
            $ref: '#/components/schemas/FamilyObligation'
        real_estate:
          type: array
          items:
            $ref: '#/components/schemas/FamilyRealEstateItem'
        confidentiality:
          $ref: '#/components/schemas/FamilyConfidentiality'
    FamilyChild:
      type: object
      required: [first_name, birth_date]
      properties:
        first_name:
          type: string
        birth_date:
          type: string
          format: date
    TaxChild:
      type: object
      required: [birth_date]
      properties:
        first_name:
          type: string
        birth_date:
          type: string
          format: date
        is_full_time_student:
          type: boolean
          description: Очное обучение для детей 18-24 лет
        is_disabled:
          type: boolean
          description: Ребенок-инвалид
    FamilyContact:
      type: object
      required: [name, relation]
      properties:
        name:
          type: string
        relation:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    FamilySpouse:
      type: object
      properties:
        employment_status:
          type: string
          enum: [employed, self_employed, unemployed, retired, other]
        monthly_income:
          type: number
          nullable: true
    FamilyRealEstateItem:
      type: object
      required: [estimated_value, status]
      properties:
        name:
          type: string
        estimated_value:
          type: number
        status:
          type: string
          enum: [owned, mortgage]
    FamilyConfidentiality:
      type: object
      properties:
        allow_spouse_access:
          type: boolean
        allow_family_contact:
          type: boolean
        notes:
          type: string
    FamilyObligation:
      type: object
      required: [type, amount_monthly]
      properties:
        type:
          type: string
          enum: [loans, mortgage, rent, alimony, education, elder_support, other]
        amount_monthly:
          type: number
    PassiveIncomeCalculationResult:
      type: object
      description: Result for PASSIVE_INCOME goal type (goal_type_id: 2)
      properties:
        goal_id:
          type: integer
          description: Goal type ID (2 for PASSIVE_INCOME)
          example: 2
        goal_name:
          type: string
          description: Goal name
          example: "Пассивный доход"
        goal_type:
          type: string
          enum: [PASSIVE_INCOME]
          description: Goal type identifier
        passive_income_calculation:
          type: object
          description: Passive income specific calculation details
          properties:
            desired_monthly_income_initial:
              type: number
              format: double
              description: Desired monthly income as specified by user (₽/month)
              example: 100000
            desired_monthly_income_with_inflation:
              type: number
              format: double
              description: Desired monthly income adjusted for inflation at goal term (₽/month)
              example: 120000
            required_capital:
              type: number
              format: double
              description: Required capital to generate desired monthly income (₽)
              example: 10000000
            yield_percent:
              type: number
              format: double
              description: Annual yield percentage used for calculation (%)
              example: 14.0
            yield_line:
              type: object
              description: Yield line used for calculation
              properties:
                min_term_months:
                  type: number
                  format: double
                  description: Minimum term in months
                max_term_months:
                  type: number
                  format: double
                  description: Maximum term in months
                min_amount:
                  type: number
                  format: double
                  description: Minimum amount
                max_amount:
                  type: number
                  format: double
                  description: Maximum amount
        financials:
          type: object
          description: Financial calculation results
          properties:
            cost_initial:
              type: number
              format: double
              description: Required capital (same as required_capital)
            cost_with_inflation:
              type: number
              format: double
              description: Required capital (inflation already applied to income, not to capital)
            inflation_annual_percent:
              type: number
              format: double
              description: Annual inflation rate used (%)
            investment_expense_growth_monthly_percent:
              type: number
              format: double
              description: Monthly investment expense growth rate (%)
            investment_expense_growth_annual_percent:
              type: number
              format: double
              description: Annual investment expense growth rate (%)
            initial_capital:
              type: number
              format: double
              description: Initial capital (₽)
            capital_gap:
              type: number
              format: double
              description: Capital shortage (₽)
            recommended_replenishment:
              type: number
              format: double
              description: Recommended monthly replenishment (₽)
            monthly_replenishment_without_pds:
              type: number
              format: double
              description: Recommended monthly replenishment without PDS cofinancing (₽)
            portfolio_yield_annual_percent:
              type: number
              format: double
              description: Portfolio annual yield (%)
        pds_cofinancing:
          type: object
          nullable: true
          description: PDS cofinancing calculation results (if PDS product is in portfolio)
          properties:
            cofinancing_next_year:
              type: integer
              description: Cofinancing amount for next year (₽)
            total_cofinancing_nominal:
              type: number
              format: double
              description: Total cofinancing amount (nominal, ₽)
            total_cofinancing_with_investment:
              type: number
              format: double
              description: Total cofinancing amount with investment growth (₽)
            pds_yield_annual_percent:
              type: number
              format: double
              description: PDS product annual yield (%)
            new_capital_gap:
              type: number
              format: double
              description: Capital gap after cofinancing (₽)
            yearly_breakdown:
              type: array
              description: Yearly breakdown of cofinancing
              items:
                type: object
                properties:
                  year:
                    type: integer
                    description: Year
                  capital_start_of_year:
                    type: number
                    format: double
                    description: Capital at start of year (₽)
                  client_contrib_year:
                    type: number
                    format: double
                    description: Client contributions for year (₽)
                  cofinancing_for_year:
                    type: number
                    format: double
                    description: Cofinancing calculated for this year (₽)
                  cofinancing_paid_in_year:
                    type: number
                    format: double
                    description: Cofinancing paid in this year (₽)
                  capital_end_of_year:
                    type: number
                    format: double
                    description: Capital at end of year (₽)
                  percentage_income:
                    type: number
                    format: double
                    description: Interest income for year (₽)
        summary:
          $ref: '#/components/schemas/GoalCalculationSummary'
        error:
          type: string
          description: Error message if calculation failed
    CalculationResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            goals_count:
              type: integer
              description: Total number of calculated goals
            total_capital:
              type: number
              format: double
              description: Cumulative projected capital across all goals (₽)
            total_state_benefit:
              type: number
              format: double
              description: Total state benefit (NSJ + PDS) accumulated across all goals (₽)
            tax_benefits_summary:
              $ref: '#/components/schemas/TaxBenefitsSummary'
        goals:
          type: array
          description: List of goals with calculation results, in the original request order
          items:
            oneOf:
              - $ref: '#/components/schemas/PortfolioCalculationResult'
              - $ref: '#/components/schemas/LifeCalculationResult'
              - $ref: '#/components/schemas/PassiveIncomeCalculationResult'
              - $ref: '#/components/schemas/PensionCalculationResult'
              - $ref: '#/components/schemas/FinReserveCalculationResult'
              - $ref: '#/components/schemas/RentCalculationResult'
    FinReserveCalculationResult:
      type: object
      properties:
        goal_id:
          type: integer
        goal_name:
          type: string
        goal_type:
          type: string
          enum: [FIN_RESERVE]
        summary:
          allOf:
            - $ref: '#/components/schemas/GoalCalculationSummary'
            - type: object
              properties:
                total_capital_at_end:
                  type: number
                  description: Accumulated capital at end of term
    RentCalculationResult:
      type: object
      properties:
        goal_id:
          type: integer
        goal_name:
          type: string
        goal_type:
          type: string
          enum: [RENT]
        summary:
          allOf:
            - $ref: '#/components/schemas/GoalCalculationSummary'
            - type: object
              properties:
                monthlyIncomeRent:
                  type: number
                  description: Monthly income generated from capital
                portfolio_yield_annual:
                  type: number
                  description: Portfolio annual yield percent
    GoalCalculationSummary:
      type: object
      description: |
        Краткая сводка по цели после расчёта; конкретный набор полей зависит от типа цели (портфель, НСЖ, пенсия и т.д.).
      additionalProperties: true
      properties:
        status:
          type: string
          description: Например OK или GAP.
        initial_capital:
          type: number
        monthly_replenishment:
          type: number
        target_months:
          type: integer
        projected_capital_at_end:
          type: number
        total_tax_benefit:
          type: number
        total_cofinancing:
          type: number
        accumulation_yield_percent:
          type: number
    PortfolioCalculationResult:
      type: object
      description: |
        Результат портфельного расчёта для **INVESTMENT** (`goal_type_id` 3) и **INHERITANCE** / «Наследство» (`11`).
        Сервис расчёта добавляет к ответу калькулятора `goal_name`, `term_months`, `risk_profile`, `risk_profile_extended`.
        Для ИСЖ в наследстве годовая доходность симуляции берётся со строки матрицы риска **«Дожитие»** в `products.lines`
        (остальные строки — для UI/отчёта и `details.insurance_risks`). См. `ProductLine` / `ProductYield` в `openapi/OPENAPI_SPEC.yaml`.
      properties:
        goal_id:
          type: integer
        goal_name:
          type: string
        goal_type_id:
          type: integer
          description: Обычно 3 (инвестиции) или 11 (наследство).
        goal_type:
          type: string
          enum: [INVESTMENT, INHERITANCE]
        term_months:
          type: integer
          nullable: true
        risk_profile:
          type: string
          nullable: true
        risk_profile_extended:
          type: string
          nullable: true
        risk_profile_details:
          type: object
          nullable: true
          additionalProperties: true
        summary:
          $ref: '#/components/schemas/GoalCalculationSummary'
        details:
          type: object
          properties:
            portfolio_id:
              type: integer
            portfolio_name:
              type: string
            initial_instruments:
              type: array
              items:
                $ref: '#/components/schemas/PortfolioInstrumentBreakdownLine'
            monthly_instruments:
              type: array
              items:
                $ref: '#/components/schemas/PortfolioInstrumentBreakdownLine'
            yearly_breakdown:
              type: array
              items:
                type: object
                additionalProperties: true
            monthly_schedule:
              type: array
              items:
                type: object
                additionalProperties: true
            insurance_risks:
              type: array
              description: |
                Строки матрицы ИСЖ в контексте срока, суммы и возраста клиента (только для INHERITANCE + продукты ISZH).
              items:
                $ref: '#/components/schemas/IszhInsuranceRiskRow'
        error:
          type: string
          description: Сообщение об ошибке расчёта
    PortfolioInstrumentBreakdownLine:
      type: object
      description: Доля инструмента/продукта в портфеле цели после расчёта.
      properties:
        name:
          type: string
        share:
          type: number
        yield:
          type: number
          description: Годовая доходность инструмента в процентах.
        amount:
          type: number
        product_type:
          type: string
          nullable: true
        product_id:
          type: integer
          nullable: true
        resolut_pfp_code:
          type: string
          nullable: true
    IszhInsuranceRiskRow:
      type: object
      description: Одна строка матрицы ИСЖ в ответе калькулятора (наследство).
      properties:
        product_id:
          type: integer
          nullable: true
        product_name:
          type: string
        risk_name:
          type: string
        term_from_months:
          type: number
        term_to_months:
          type: number
        age_from:
          type: integer
          nullable: true
        age_to:
          type: integer
          nullable: true
        amount_from:
          type: number
        amount_to:
          type: number
        payment_ratio:
          type: number
          nullable: true
          description: Коэффициент платежа для отображения (не подменяет логику доходности).
        yield_percent:
          type: number
          nullable: true
          description: Для строки «Дожитие» заполнено; для прочих рисков может быть null.
    LifeCalculationResult:
      type: object
      description: Result for LIFE goal type (NSJ calculation)
      properties:
        goal_id:
          type: integer
          description: Goal type ID (5 for LIFE)
          example: 5
        goal_name:
          type: string
          description: Goal name
          example: "Жизнь"
        goal_type:
          type: string
          enum: [LIFE]
          description: Goal type identifier
        nsj_calculation:
          type: object
          description: NSJ API calculation result
          properties:
            success:
              type: boolean
              description: Whether the calculation was successful
              example: true
            term_years:
              type: integer
              description: Insurance term in years
              example: 5
            risks:
              type: array
              description: Array of insurance risks
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: Risk code (e.g., "endowment", "death")
                    example: "endowment"
                  name:
                    type: string
                    description: Risk name
                    example: "Накопительное страхование жизни"
                  type:
                    type: string
                    description: Risk type
                  participant:
                    type: string
                    description: Participant type (e.g., "insuredPerson")
                    example: "insuredPerson"
                  term:
                    type: integer
                    description: Risk term in years
                  tariff:
                    type: number
                    description: Risk tariff
                  limit:
                    type: number
                    description: Insurance sum for this risk in contract currency
                  premium:
                    type: number
                    description: Premium for this risk in contract currency
                  limitRUR:
                    type: number
                    description: Insurance sum for this risk in RUB
                  premiumRUR:
                    type: number
                    description: Premium for this risk in RUB
            total_premium:
              type: number
              description: Total premium in RUB
              example: 500000
            total_premium_rur:
              type: number
              description: Total premium in RUB (alternative field name)
              example: 500000
            total_limit:
              type: number
              description: Total insurance sum
              example: 3000000
            garantProfit:
              type: number
              description: Guaranteed profit
              example: 0
            payTerm:
              type: integer
              description: Payment term in years
              example: 5
            payEndDate:
              type: integer
              format: int64
              description: Payment end date (UNIX timestamp ms)
            comission:
              type: object
              description: Commission information
              properties:
                percent:
                  type: number
                  description: Commission percentage
                  example: 5
                amount:
                  type: number
                  description: Commission amount
                  example: 174000
            rvd:
              type: number
              nullable: true
              description: RVD (reserve for payments)
            cashSurrenderValues:
              type: array
              nullable: true
              description: Cash surrender values
              items:
                type: object
            payments_list:
              type: array
              description: Payment schedule
              items:
                type: object
                properties:
                  i:
                    type: integer
                    description: Payment number
                    example: 1
                  date:
                    type: integer
                    format: int64
                    description: Payment date (UNIX timestamp ms)
                  endDate:
                    type: integer
                    format: int64
                    description: End date of paid period (UNIX timestamp ms)
                  premium:
                    type: number
                    description: Payment amount
                    example: 3480000
                  dueDate:
                    type: integer
                    format: int64
                    description: Due date (UNIX timestamp ms)
            warnings:
              type: array
              description: Calculation warnings
              items:
                type: string
            calculation_date:
              type: integer
              format: int64
              description: Calculation timestamp (UNIX milliseconds)
        error:
          type: string
          description: Error message if NSJ calculation failed
        nsj_error_details:
          type: array
          description: Detailed error information from NSJ API
          items:
            type: object
            properties:
              tariff:
                type: number
              limit:
                type: number
              premium:
                type: number
              limitRUR:
                type: number
              premiumRUR:
                type: number
              total_premium:
                type: number
              total_premium_rur:
                type: number
              total_limit:
                type: number
              payments_list:
                type: array
                items:
                  type: object
              warnings:
                type: array
                items:
                  type: string
              calculation_date:
                type: integer
        details:
          type: object
          description: Detailed Life Insurance calculation results
          properties:
            term_months:
              type: integer
              description: Insurance term in months
            target_amount_initial:
              type: number
              description: Initial target amount (insurance sum)
            target_capital_required:
              type: number
              description: Required capital (same as insurance sum)
            payment_variant:
              type: integer
              description: Payment frequency (0=once, 1=annual, 12=monthly)
            program:
              type: string
              description: NSJ program code
            annual_premium:
              type: number
              description: Annual insurance premium (RUB/year)
            tax_deduction_2026:
              type: number
              description: Tax deduction for 2026 (first year, RUB)
            total_tax_deductions:
              type: number
              description: Total tax deductions over all years (RUB)
            portfolio:
              type: object
              properties:
                name:
                  type: string
                  description: Portfolio name (e.g. "Life Insurance Contract")
                instruments:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      share:
                        type: number
                      yield:
                        type: number
                      amount:
                        type: number
        summary:
          allOf:
            - $ref: '#/components/schemas/GoalCalculationSummary'
            - type: object
              properties:
                state_benefit:
                  type: number
                  description: Total tax deductions over all years (НСЖ вычеты, RUB)
        error:
          type: string
          description: Error message if NSJ calculation failed


    TaxBenefitsSummary:
      type: object
      description: Summary of all tax benefits (PDS cofinancing + tax deductions from all goals)
      properties:
        pds_benefits:
          type: object
          description: PDS (Program of State Cofinancing) benefits from all goals
          properties:
            deduction_2026:
              type: number
              description: PDS tax deduction for 2026 (first year, RUB)
            total_deductions:
              type: number
              description: Total PDS tax deductions over all years (RUB)
            total_cofinancing:
              type: number
              description: Total PDS cofinancing over all years (RUB)
        iis_benefits:
          type: object
          description: IIS benefits
          properties:
            deduction_2026:
              type: number
              description: IIS tax deduction for 2026 (RUB)
            total_deductions:
              type: number
              description: Total IIS tax deductions over all years (RUB)
        children_benefits:
          type: object
          description: Standard children tax deductions
          properties:
            deduction_2026:
              type: number
              description: Children tax deduction for 2026 (RUB)
            total_deductions:
              type: number
              description: Total children tax deductions over all years (RUB)
        nsj_benefits:
          type: object
          description: NSJ (Life Insurance) benefits
          properties:
            annual_premium:
              type: number
              description: Annual NSJ insurance premium (RUB/year)
            deduction_2026:
              type: number
              description: NSJ tax deduction for 2026 (first year, RUB)
            total_deductions:
              type: number
              description: Total NSJ tax deductions over all years (RUB)
        totals:
          type: object
          description: Total benefits (PDS + IIS + children + NSJ)
          properties:
            deduction_2026:
              type: number
              description: Total tax deductions for 2026 (PDS + NSJ, RUB)
            total_deductions:
              type: number
              description: Total tax deductions over all years (PDS + NSJ, RUB)
            total_state_benefits:
              type: number
              description: Total state benefits including cofinancing and deductions (RUB)
    TaxPlanningRequest:
      type: object
      required: [client]
      properties:
        client:
          type: object
          required: [avg_monthly_income]
          properties:
            avg_monthly_income:
              type: number
            spouse_avg_monthly_income:
              type: number
              nullable: true
            tax_family_mode:
              type: string
              enum: [single, both_parents, single_parent_double]
            tax_children:
              type: array
              items:
                $ref: '#/components/schemas/TaxChild'
        deductions:
          type: object
          properties:
            property_purchase_amount:
              type: number
            mortgage_interest_amount:
              type: number
            social_expenses_amount:
              type: number
    TaxPlanningResponse:
      type: object
      additionalProperties: true
    Client:
      type: object
      required:
        - first_name
        - last_name
