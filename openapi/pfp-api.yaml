            $ref: '#/components/schemas/ClientCredit'
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/ClientExpense'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/ClientGoal'
      example:
        client:
          first_name: Иван
          last_name: Иванов
          email: ivan@example.com
        credits:
          - type: MORTGAGE
            balance: 4200000
            monthlyPayment: 43000
            rate: 12.5
          - type: CREDIT_CARD
            balance: 150000
            monthlyPayment: 12000
            rate: 29.9

    FullClientResponse:
      allOf:
        - $ref: '#/components/schemas/FullClientRequest'

    AgentComonStrategyPortfolioItem:
      type: object
