openapi: 3.0.3
info:
  title: PFP Content Factory API
  version: 0.1.0
  description: |
    Фабрика контента: HTML-шаблоны и предложения (admin), каталог и презентации (agent).
    Атрибуция CTA: query `utm_agent=` (partner_agent_id агента или agent id).
    Полный handoff: docs/CONTENT_FACTORY.md

servers:
  - url: /api

tags:
  - name: ContentFactoryAdmin
  - name: ContentFactoryAgent

paths:
  /admin/content-factory/templates:
    get:
      tags: [ContentFactoryAdmin]
      summary: List HTML templates (project)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
      responses:
        '200':
          description: OK
    post:
      tags: [ContentFactoryAdmin]
      summary: Create template (html_source required; CTA slot auto-ensured)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTemplateCreate'
      responses:
        '201':
          description: Created

  /admin/content-factory/templates/{id}:
    get:
      tags: [ContentFactoryAdmin]
      summary: Get template
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
    put:
      tags: [ContentFactoryAdmin]
      summary: Update template
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTemplateCreate'
      responses:
        '200':
          description: OK
    delete:
      tags: [ContentFactoryAdmin]
      summary: Delete template
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /admin/content-factory/offers:
    get:
      tags: [ContentFactoryAdmin]
      summary: List offers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: OK
    post:
      tags: [ContentFactoryAdmin]
      summary: Create offer draft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentOfferCreate'
      responses:
        '201':
          description: Created

  /admin/content-factory/offers/{id}:
    get:
      tags: [ContentFactoryAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
    put:
      tags: [ContentFactoryAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentOfferCreate'
      responses:
        '200':
          description: OK
    delete:
      tags: [ContentFactoryAdmin]
      summary: Archive offer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /admin/content-factory/offers/{id}/generate:
    post:
      tags: [ContentFactoryAdmin]
      summary: Fill template → generated_html (optional use_llm polish)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                use_llm: { type: boolean, default: false }
      responses:
        '200':
          description: OK

  /admin/content-factory/offers/{id}/publish:
    post:
      tags: [ContentFactoryAdmin]
      summary: Publish to agent catalog
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /admin/content-factory/offers/{id}/unpublish:
    post:
      tags: [ContentFactoryAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /admin/content-factory/offers/{id}/chat/messages:
    get:
      tags: [ContentFactoryAdmin]
      summary: AI chat history for offer HTML edits
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
    post:
      tags: [ContentFactoryAdmin]
      summary: AI edit HTML (preserves data-cta-slot)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XProjectKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: Updated offer + messages

  /pfp/content-factory/offers:
    get:
      tags: [ContentFactoryAgent]
      summary: Published non-expired offers (agent dashboard)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /pfp/content-factory/offers/{id}:
    get:
      tags: [ContentFactoryAgent]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /pfp/content-factory/presentations:
    get:
      tags: [ContentFactoryAgent]
      summary: My presentations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [ContentFactoryAgent]
      summary: Create presentation from offer_ids
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [offer_ids]
              properties:
                title: { type: string }
                offer_ids:
                  type: array
                  items: { type: integer }
                recipient_client_id: { type: integer, nullable: true }
      responses:
        '201':
          description: Created

  /pfp/content-factory/presentations/{id}:
    get:
      tags: [ContentFactoryAgent]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
    patch:
      tags: [ContentFactoryAgent]
      summary: Update presentation (offer_ids re-validated as published)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                offer_ids:
                  type: array
                  items: { type: integer }
                recipient_client_id: { type: integer, nullable: true }
                email_subject: { type: string }
                email_body: { type: string }
      responses:
        '200':
          description: OK

  /pfp/content-factory/presentations/{id}/pdf:
    post:
      tags: [ContentFactoryAgent]
      summary: Generate PDF with utm_agent on CTA buttons
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: download
          in: query
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: JSON with pdf_base64 or raw PDF if download=1

  /pfp/content-factory/presentations/{id}/email-draft:
    post:
      tags: [ContentFactoryAgent]
      summary: AI email subject/body draft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /pfp/content-factory/presentations/{id}/send:
    post:
      tags: [ContentFactoryAgent]
      summary: Email PDF to client (or body.to)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email }
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    XProjectKey:
      name: x-project-key
      in: header
      schema: { type: string }
      description: Admin project context
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    ContentTemplateCreate:
      type: object
      required: [title, html_source]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        html_source:
          type: string
          description: HTML with {{placeholders}} and preferably <a data-cta-slot href="{{cta_href}}">
        slots: { type: object, additionalProperties: true }
        is_active: { type: boolean }
    ContentOfferCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        kind: { type: string, example: product }
        template_id: { type: integer }
        payload:
          type: object
          additionalProperties: true
          description: title, body, chart data, etc. → {{keys}} in template
        cta_url_base: { type: string }
        cta_label: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
