openapi: 3.0.0
info:
  title: PFP B2C Schemas (Client Cabinet)
  version: 1.0.0
  description: |
    Shared schemas and parameters for B2C Client Cabinet. Endpoints are documented in docs/api/b2c_lk.yaml.
    Стратегии Comon для клиента — также в openapi/pfp-api.yaml (paths /my/comon-strategies, тег Comon Client LK).
servers:
  - url: /api
    description: Main API server

security:
  - bearerAuth: []

paths:
  /my/risk-profile/questionnaire:
    get:
      tags: [ClientPlan]
      summary: Get active risk-profile questionnaire
      responses:
        '200':
          description: Questionnaire metadata and answer options
          content:
            application/json:
              schema:
                type: object
                properties:
                  questionnaire:
                    $ref: '#/components/schemas/RiskQuestionnaire'

  /my/risk-profile/answers:
    get:
      tags: [ClientPlan]
      summary: Get saved risk-profile answers for current client
      responses:
        '200':
          description: Saved answers and latest risk-profile result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskProfileAnswersPayload'
    post:
      tags: [ClientPlan]
      summary: Save risk-profile answers for current client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskProfileAnswersPayload'
      responses:
        '200':
          description: Answers saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  risk_profile_answers:
                    type: object
                    additionalProperties:
                      type: string
                  risk_questionnaire_version_id:
                    type: integer

  /my/plan/first-run:
    post:
      tags: [ClientPlan]
      summary: Create or update financial plan (first run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '200':
          description: Calculation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'

  /my/plan/{goalId}/recalculate:
    post:
      tags: [ClientPlan]
      summary: Recalculate one goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationGoal'
      responses:
        '200':
          description: Recalculation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'

  /my/plan/goals:
    post:
      tags: [ClientPlan]
      summary: Add a new goal to plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationGoal'
      responses:
        '200':
          description: Goal added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'

  /my/plan/goals/{goalId}:
    delete:
      tags: [ClientPlan]
      summary: Delete goal from plan
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  parameters:
    ProjectKeyHeader:
      name: x-project-key
      in: header
      required: false
      description: Public Project Key
      schema:
        type: string

  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string
              example: client
            clientId:
              type: integer
            projectId:
              type: integer

    ClientFullData:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        project_id:
          type: integer
        goals_summary:
          type: object
          description: Last calculation results snapshot
        goals:
          type: array
          items:
            $ref: '#/components/schemas/CalculationGoalWithId'
        assets:
          type: array
          items:
            type: object

    CalculationRequest:
      type: object
      required:
        - goals
      properties:
        goals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CalculationGoal'
          description: Array of goals to calculate
        client:
          $ref: '#/components/schemas/ClientData'

    CalculationGoal:
      type: object
      required:
        - goal_type_id
        - name
      properties:
        goal_type_id:
          type: integer
          description: Portfolio class ID. 5 for LIFE, 7 for FIN_RESERVE, 8 for RENT, 2 for PASSIVE_INCOME
        name:
          type: string
          description: Goal name
        target_amount:
          type: number
          description: Target amount (or monthly income for PASSIVE_INCOME)
        term_months:
          type: integer
          description: Term in months
        risk_profile:
          type: string
          enum: [CONSERVATIVE, BALANCED, AGGRESSIVE]
        initial_capital:
          type: number
          default: 0
        inflation_rate:
          type: number
        avg_monthly_income:
          type: number
        start_date:
          type: string
          format: date
        monthly_replenishment:
          type: number
        payment_variant:
          type: integer
          enum: [0, 1, 2, 4, 12]
          description: NSJ payment variant (LIFE goals)
        program:
          type: string
          description: NSJ product code

    CalculationGoalWithId:
      allOf:
        - $ref: '#/components/schemas/CalculationGoal'
        - type: object
          properties:
            id:
              type: integer
            goal_id:
              type: integer

    ClientData:
      type: object
      properties:
        birth_date:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female, M, F]
        fio:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        risk_profile_answers:
          type: object
          description: Answers map (question code -> selected option code/legacy score)
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
        risk_questionnaire_version_id:
          type: integer
          description: Questionnaire version used to collect answers
        family_profile:
          $ref: '#/components/schemas/FamilyProfile'

    RiskProfileAnswersPayload:
      type: object
      properties:
        risk_profile_answers:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
        risk_questionnaire_version_id:
          type: integer
        risk_profile_result:
          type: object
          additionalProperties: true
        risk_profile_explanation:
          $ref: '#/components/schemas/RiskProfileExplanation'

    RiskProfileExplanation:
      type: object
      properties:
        version:
          type: string
          example: v1
        generated_at:
          type: string
          format: date-time
        source_hash:
          type: string
          example: sha256:9b7e...
        title:
          type: string
        summary:
          type: string
        key_factors:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        caution:
          type: string
        agent_note:
          type: string

    RiskQuestionnaire:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/RiskQuestionnaireQuestion'

    RiskQuestionnaireQuestion:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        help_text: { type: string, nullable: true }
        category: { type: string }
        sort_order: { type: integer }
        options:
          type: array
          items:
            $ref: '#/components/schemas/RiskQuestionnaireOption'

    RiskQuestionnaireOption:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        label: { type: string }
        score: { type: number }
        sort_order: { type: integer }

    FamilyProfile:
      type: object
      description: Reference family profile metadata, not used in calculations.
      properties:
        marital_status:
          type: string
          enum: [single, married, divorced, widowed, civil_union]
        children:
          type: array
          items:
            $ref: '#/components/schemas/FamilyChild'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/FamilyContact'
        spouse:
          $ref: '#/components/schemas/FamilySpouse'
        family_obligations:
          type: array
          items:
            $ref: '#/components/schemas/FamilyObligation'
        real_estate:
          type: array
          items:
            $ref: '#/components/schemas/FamilyRealEstateItem'
        confidentiality:
          $ref: '#/components/schemas/FamilyConfidentiality'
      example:
        marital_status: married
        children:
          - first_name: Anna
            birth_date: '2017-05-10'
        contacts:
          - name: Elena Petrova
            relation: spouse
            phone: '+7-900-000-00-00'
            email: 'elena@example.com'
        spouse:
          employment_status: employed
          monthly_income: 120000
        family_obligations:
          - type: mortgage
            amount_monthly: 85000
          - type: education
            amount_monthly: 25000
        real_estate:
          - name: Main apartment
            estimated_value: 14500000
            status: mortgage
        confidentiality:
          allow_spouse_access: true
          allow_family_contact: false
          notes: ''

    FamilyChild:
      type: object
      required: [first_name, birth_date]
      properties:
        first_name:
          type: string
        birth_date:
          type: string
          format: date

    FamilyContact:
      type: object
      required: [name, relation]
      properties:
        name:
          type: string
        relation:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    FamilySpouse:
      type: object
      properties:
        employment_status:
          type: string
          enum: [employed, self_employed, unemployed, retired, other]
        monthly_income:
          type: number
          nullable: true

    FamilyRealEstateItem:
      type: object
      required: [estimated_value, status]
      properties:
        name:
          type: string
        estimated_value:
          type: number
        status:
          type: string
          enum: [owned, mortgage]

    FamilyConfidentiality:
      type: object
      properties:
        allow_spouse_access:
          type: boolean
        allow_family_contact:
          type: boolean
        notes:
          type: string

    FamilyObligation:
      type: object
      required: [type, amount_monthly]
      properties:
        type:
          type: string
          enum: [loans, mortgage, rent, alimony, education, elder_support, other]
        amount_monthly:
          type: number

    CalculationResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            goals_count:
              type: integer
            total_capital:
              type: number
            total_state_benefit:
              type: number
        goals:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/GenericCalculationResult'
              - $ref: '#/components/schemas/LifeCalculationResult'
              - $ref: '#/components/schemas/PassiveIncomeCalculationResult'

    GenericCalculationResult:
      type: object
      properties:
        goal_id: { type: integer }
        goal_name: { type: string }
        financials:
          type: object
          properties:
            cost_initial: { type: number }
            cost_with_inflation: { type: number }
            capital_gap: { type: number }
            recommended_replenishment: { type: number }
        summary:
          type: object
          properties:
            success: { type: boolean }

    LifeCalculationResult:
      type: object
      properties:
        goal_id: { type: integer }
        goal_name: { type: string }
        nsj_calculation:
          type: object
          properties:
            total_premium: { type: number }
            total_limit: { type: number }

    PassiveIncomeCalculationResult:
      type: object
      properties:
        goal_id: { type: integer }
        goal_name: { type: string }
        passive_income_calculation:
          type: object
          properties:
            required_capital: { type: number }
            yield_percent: { type: number }

  # ==================== AI B2C Chat ====================

  /my/ai-b2c/chat:
    post:
      summary: Отправить сообщение ИИ-ассистенту (обычный ответ)
      tags: [AiB2C]
      description: |
        Отправляет сообщение ИИ-ассистенту на конкретном этапе.
        ИИ учитывает:
        - Базовые знания (Brain Contexts)
        - Контекст текущего этапа (Stage Context)
        - Данные клиента (финплан, цели, активы)
        - Историю чата на этом этапе
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, message]
              properties:
                stage:
                  type: string
                  description: Ключ этапа/страницы (любая строка, заданная в админке)
                  example: AI_B2C_site
                message:
                  type: string
                  description: Сообщение от пользователя
                  example: "Хочу накопить на квартиру за 5 лет"
      responses:
        '200':
          description: Ответ ИИ
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: { type: string }
                  response: { type: string, description: 'Ответ ИИ в формате Markdown' }

  /my/ai-b2c/chat/stream:
    post:
      summary: Отправить сообщение ИИ-ассистенту (стриминг SSE)
      tags: [AiB2C]
      description: |
        То же самое, что /my/ai-b2c/chat, но ответ идёт потоково (Server-Sent Events).
        На фронте используйте fetch + ReadableStream для получения ответа по частям.
        
        **Формат ответа:** text/event-stream (SSE)
        ```
        data: {"choices":[{"delta":{"content":"Прив"}}]}
        data: {"choices":[{"delta":{"content":"ет!"}}]}
        data: [DONE]
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, message]
              properties:
                stage: { type: string, example: chooseTarget }
                message: { type: string }
      responses:
        '200':
          description: SSE stream с ответом ИИ

  /my/ai-b2c/history:
    get:
      summary: Получить историю чата
      tags: [AiB2C]
      parameters:
        - name: stage
          in: query
          description: Фильтр по этапу (опционально)
          schema:
            type: string
            example: chooseTarget
      responses:
        '200':
          description: История сообщений
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    stage_key: { type: string }
                    role: { type: string, enum: [user, assistant] }
                    content: { type: string }
                    created_at: { type: string, format: date-time }
    delete:
      summary: Очистить историю чата
      tags: [AiB2C]
      parameters:
        - name: stage
          in: query
          description: Очистить только конкретный этап (опционально, без параметра очистит всё)
          schema:
            type: string
      responses:
        '200':
          description: История очищена

  /my/ai-b2c/settings:
    get:
      summary: Получить настройки ассистента (имя, аватар, описание)
      tags: [AiB2C]
      description: |
        Возвращает настройки AI B2C ассистента в рамках проекта клиента.
        Используется фронтом ЛК клиента для отображения имени, аватара и зелёной подписи ассистента.
      responses:
        '200':
          description: Настройки ассистента или null, если ещё не настроены
          content:
            application/json:
              schema:
                $ref: '../docs/api/aiB2c.yaml#/components/schemas/AiB2cSettingsPublic'

