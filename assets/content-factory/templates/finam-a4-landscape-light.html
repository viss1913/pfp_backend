<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finam Content Factory — finam-a4-landscape-light</title>
  <style>
    @page { size: 297mm 210mm; margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6f8;
      color: #1a1a1a;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 297mm;
      min-height: 210mm;
      margin: 0 auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 1px #e2e5ea;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14mm 16mm 10mm;
      border-bottom: 1px solid #e2e5ea;
    }
    .logo img {
      height: 32px;
      width: auto;
      display: block;
      filter: none;
    }
    .header-meta {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5c6370;
    }
    .content {
      flex: 1 1 auto;
      padding: 12mm 16mm 10mm;
      min-height: 145mm;
    }
    .content h1 {
      margin: 0 0 8mm;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .content .lead {
      margin: 0 0 10mm;
      font-size: 15px;
      line-height: 1.55;
      color: #5c6370;
      max-width: 95%;
    }
    .content .placeholder {
      border: 1px dashed #e2e5ea;
      border-radius: 8px;
      padding: 16mm 12mm;
      text-align: center;
      color: #5c6370;
      font-size: 13px;
      line-height: 1.5;
      background: #fafbfc;
    }
    .cta-area {
      margin-top: 12mm;
      text-align: center;
    }
    .cta-area a[data-cta-slot] {
      display: inline-block;
      padding: 12px 28px;
      background: #e85c0d;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .footer {
      margin-top: auto;
      padding: 6mm 16mm 8mm;
      border-top: 1px solid #e2e5ea;
      background: #f0f1f4;
      font-size: 10px;
      line-height: 1.45;
      color: #5c6370;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media print {
      body { background: #ffffff; }
      .sheet { box-shadow: none; margin: 0; }
    }
  </style>
</head>
